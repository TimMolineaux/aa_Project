<!DOCTYPE html>
<html lang="nl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

<div th:insert="layout :: navbar"></div>

<main>
    <h1>Onze boekencatalogus</h1>

    <p th:if="${#lists.isEmpty(boeken)}">
        Er zijn momenteel geen boeken beschikbaar.
    </p>

    <ul>
        <li th:each="boek : ${boeken}">
            <a th:href="@{/boeken/{isbn}(isbn=${boek.isbn})}"
               th:text="${boek.titel}">
                Boektitel
            </a>
        </li>
    </ul>
</main>

</body>
</html>
