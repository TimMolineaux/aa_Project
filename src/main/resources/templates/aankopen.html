<!DOCTYPE html>
<html lang="nl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

<div th:insert="layout :: navbar"></div>

<main>
    <h1>Mijn aankopen</h1>

    <p th:if="${#lists.isEmpty(aankopen)}">
        Je hebt nog geen aankopen.
    </p>

    <table th:unless="${#lists.isEmpty(aankopen)}">
        <thead>
        <tr>
            <th>Boek</th>
            <th>Aantal</th>
            <th>Aankoopdatum</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="aankoop : ${aankopen}">
            <td th:text="${aankoop.boek.titel}"></td>
            <td th:text="${aankoop.amount}"></td>
            <td th:text="${aankoop.purchaseDate}"></td>
        </tr>
        </tbody>
    </table>
</main>

</body>
</html>
