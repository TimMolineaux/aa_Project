<!DOCTYPE html>
<html lang="nl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

<div th:insert="layout :: navbar"></div>

<main>
    <a th:href="@{/}">← Terug naar de catalogus</a>

    <h1 th:text="${boek.titel}">Boektitel</h1>

    <p>
        <strong>ISBN:</strong>
        <span th:text="${boek.isbn}"></span>
    </p>

    <p>
        <strong>Auteur(s):</strong>
        <span th:text="${boek.auteurs}"></span>
    </p>

    <p>
        <strong>Beschrijving:</strong>
        <span th:text="${boek.beschrijving}"></span>
    </p>

    <p>
        <strong>Genre:</strong>
        <span th:text="${boek.genre}"></span>
    </p>

    <p>
        <strong>Prijs:</strong>
        €<span th:text="${boek.prijs}"></span>
    </p>

    <p>
        <strong>Aantal op voorraad:</strong>
        <span th:text="${boek.voorraad}"></span>
    </p>

    <h2>Reviews</h2>
    <p>TBD</p>
</main>

</body>
</html>
